---
name: "Payload provider: test and publish image"

# Fork-only workflow: tests the Payload provider against a scratch Payload and
# publishes the image to ghcr.io/justanarthur/postiz on every push to main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/justanarthur/postiz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
          run_install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir var/payload-scratch install --ignore-workspace --frozen-lockfile

      - name: Test the Payload provider
        run: node_modules/.bin/vitest run --config var/payload-scratch/vitest.config.mts

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${{ github.sha }} \
            --provenance=false --sbom=false \
            --output "type=registry,name=${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}" .

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the multi-arch tags
        run: |
          for tag in ${{ github.sha }} latest; do
            docker manifest rm ${{ env.IMAGE }}:$tag || true
            docker manifest create ${{ env.IMAGE }}:$tag \
              --amend ${{ env.IMAGE }}:${{ github.sha }}-amd64 \
              --amend ${{ env.IMAGE }}:${{ github.sha }}-arm64
            docker manifest push ${{ env.IMAGE }}:$tag
          done
